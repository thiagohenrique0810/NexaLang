name: NexaLang CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC build tools were not found' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check native compiler
        run: clang --version

      - name: Build host runtime from source
        run: python runtime/build_runtime.py

      - name: Run bootstrap suite
        run: python tests/run_tests.py

      - name: Run behavioral and sanitizer regressions
        run: python -m unittest discover -s tests -p "test_*regressions.py" -v

      - name: Compile examples and verify expected errors
        run: python tests/check_examples.py

      - name: Execute packed weights larger than the managed CPU arena
        run: python tools/nexa_bench.py --generate-demo --pack artifacts/models/ci-q4.nxp --rows 2048 --cols 128 --tile-rows 32 --memory-budget 96KiB --verify --report artifacts/reports/ci-q4.json --csv artifacts/reports/ci-q4.csv

      - name: Convert and inspect portable TQ vectors
        run: |
          python -c "from pathlib import Path; import struct; p = Path('artifacts/models/ci-tq.f32'); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(struct.pack('<8f', 0, 1, -2, 3, -4, 5, -6, 7) * 16)"
          python tools/nexa_convert.py artifacts/models/ci-tq.f32 --out artifacts/models/ci-tq.nxp --rows 16 --cols 8 --codec tq --bits 3 --seed 42 --block-rows 4 --memory-budget 96KiB
          python tools/nexa_inspect.py artifacts/models/ci-tq.nxp --verify

      - name: Compile architecture and import a tiny local checkpoint
        run: |
          python tools/nexa_model.py models/nexalm512/architecture.nxl --out artifacts/reports/model-definitions.json
          python tests/model_checkpoint_fixture.py --out artifacts/checkpoints/ci-tiny
          python tools/nexa_convert.py --checkpoint artifacts/checkpoints/ci-tiny --out artifacts/models/ci-tiny --group-size 4 --block-rows 3
          python tools/nexa_inspect.py artifacts/models/ci-tiny --verify
          python tools/nexa_bench.py --bundle artifacts/models/ci-tiny --tensor lm_head.weight --memory-budget 96KiB --verify --report artifacts/reports/ci-bundle-q4.json

      - name: Execute native Transformer prefill and decode
        run: |
          python tools/nexa_model.py models/nexalm512/architecture.nxl --sequence-length 4 --out artifacts/reports/transformer-graphs.json
          python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3 --decode-tokens 5,7 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-forward.json

      - name: Execute incremental KV and chunked prefill
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --decode-tokens 7 --kv-cache --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-f32.json

      - name: Execute on-demand paged KV
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --decode-tokens 7 --kv-cache --kv-page-tokens 2 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-paged.json

      - name: Execute packed Q4 KV attention
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --decode-tokens 7 --kv-cache --kv-page-tokens 2 --kv-codec q4 --kv-group-size 3 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-q4.json

      - name: Execute packed Q3 KV attention
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --decode-tokens 7 --kv-cache --kv-page-tokens 2 --kv-codec q3 --kv-group-size 3 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-q3.json

      - name: Execute paged TQ KV attention with planned scratch
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --decode-tokens 7 --kv-cache --kv-page-tokens 2 --kv-codec tq --kv-bits 3 --kv-seed 42 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-tq.json

      - name: Execute transactional hot warm cold KV page aging
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3 --decode-tokens 5,7 --kv-cache --kv-page-tokens 1 --kv-policy age --kv-hot-pages 1 --kv-warm-pages 1 --kv-group-size 3 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-tiers.json

      - name: Check changed whitespace
        run: git diff --check

      - name: Execute cold KV eviction and bounded reload
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3 --decode-tokens 5,7 --kv-cache --kv-page-tokens 1 --kv-policy age --kv-backing-store artifacts/kv-store/ci --kv-group-size 3 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-offloaded.json

      - name: Execute cold KV reuse with several reload slots
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3 --decode-tokens 5,7 --kv-cache --kv-page-tokens 1 --kv-policy age --kv-backing-store artifacts/kv-store/ci-slots --kv-reload-slots 4 --kv-group-size 3 --prefill-chunk-size 2 --memory-budget 96KiB --tile-rows 3 --report artifacts/reports/ci-kv-reload-slots.json

      - name: Execute a derived sequence sharing the paged prefix
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5,7 --kv-cache --kv-page-tokens 2 --kv-codec q4 --kv-group-size 4 --max-sequence-length 8 --tile-rows 3 --memory-budget 1MiB --fork-tokens 2,4 --report artifacts/reports/ci-kv-sequences.json

      - name: Convert a dense reference bundle and run it
        run: |
          python tools/nexa_convert.py --checkpoint artifacts/checkpoints/ci-tiny --out artifacts/models/ci-dense --dense-all --block-rows 3
          python tools/nexa_inspect.py artifacts/models/ci-dense --verify
          python tools/nexa_run.py artifacts/models/ci-dense --tokens 1,3 --decode-tokens 5 --tile-rows 3 --memory-budget 4MiB --report artifacts/reports/ci-dense.json

      - name: Convert and run a Q3 weight bundle
        run: |
          python tools/nexa_convert.py --checkpoint artifacts/checkpoints/ci-tiny --out artifacts/models/ci-q3 --matrix-codec q3 --group-size 8 --block-rows 3
          python tools/nexa_inspect.py artifacts/models/ci-q3 --verify
          python tools/nexa_run.py artifacts/models/ci-q3 --tokens 1,3 --decode-tokens 5 --tile-rows 3 --memory-budget 4MiB --report artifacts/reports/ci-q3.json

      - name: Convert and run a Q8 weight bundle
        run: |
          python tools/nexa_convert.py --checkpoint artifacts/checkpoints/ci-tiny --out artifacts/models/ci-q8 --matrix-codec q8 --group-size 4 --block-rows 3
          python tools/nexa_inspect.py artifacts/models/ci-q8 --verify
          python tools/nexa_run.py artifacts/models/ci-q8 --tokens 1,3 --decode-tokens 5 --tile-rows 3 --memory-budget 4MiB --report artifacts/reports/ci-q8.json

      - name: Calibrate one tensor against a dense reference
        run: python tools/nexa_calibrate.py --checkpoint artifacts/checkpoints/ci-tiny --tokens 1,3 --group-size 4 --block-rows 3 --tile-rows 3 --memory-budget 8MiB --tensor model.embed_tokens.weight --report artifacts/reports/ci-calibration.json

      - name: Plan a precision map and convert by it
        run: |
          python tools/nexa_precision.py plan --calibration artifacts/reports/ci-calibration.json --budget 4KiB --out artifacts/precision/ci-map.json
          python tools/nexa_precision.py show artifacts/precision/ci-map.json
          python tools/nexa_convert.py --checkpoint artifacts/checkpoints/ci-tiny --out artifacts/models/ci-planned --precision-map artifacts/precision/ci-map.json --group-size 4 --block-rows 3
          python tools/nexa_run.py artifacts/models/ci-planned --tokens 1,3 --tile-rows 3 --memory-budget 8MiB --report artifacts/reports/ci-planned.json

      - name: Train a tokenizer and verify its asset offline
        run: |
          python -c "from pathlib import Path; p = Path('artifacts/corpus'); p.mkdir(parents=True, exist_ok=True); (p / 'sample.txt').write_text('O NexaLang executa modelos com memoria limitada e atencao paginada.\n' * 24, encoding='utf-8')"
          python tools/nexa_tokenizer.py train --corpus artifacts/corpus --out artifacts/tokenizers/ci --vocab-size 300
          python tools/nexa_tokenizer.py inspect artifacts/tokenizers/ci
          python tools/nexa_tokenizer.py encode artifacts/tokenizers/ci --text "O NexaLang <|system|> 512" --prefix "<|bos|>"

      - name: Execute a derived sequence under age tiers
        run: python tools/nexa_run.py artifacts/models/ci-tiny --tokens 1,3,5 --kv-cache --kv-page-tokens 1 --kv-policy age --kv-hot-pages 1 --kv-warm-pages 1 --kv-group-size 3 --max-sequence-length 8 --tile-rows 3 --memory-budget 1MiB --fork-tokens 7,2 --report artifacts/reports/ci-kv-tiered-sequences.json
